services:
  mysql:
    image: mysql:8.0
    platform: linux/arm64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ${MYSQL_DATABASE:-discordbot}
      MYSQL_USER: ${MYSQL_USER:-botuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-strongpassword}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./bot/src:/app/src
    environment:
      - NODE_ENV=production

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      bot:
        condition: service_started
    volumes:
      - ./dashboard/src:/app/src

volumes:
  mysql_data:
